<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcanum – Abgemeldet</title>
    <link rel="stylesheet" href="/arcanum-logout.css">
</head>
<body class="arcanum-logout-page">
    <main class="logout-page">
        <section class="logout-panel" aria-labelledby="logout-title">
            <div class="logout-brand" aria-hidden="true">
                <img
                    class="logout-brand__logo"
                    src="/arcanum-logo.png"
                    alt="Arcanum"
                >
            </div>

            <p class="logout-eyebrow">Basiscamp Arcanum</p>

            <h1 class="logout-title" id="logout-title">
                Du hast dich erfolgreich abgemeldet!
            </h1>

            <p class="logout-copy">
                Wie möchtest du weitergehen?
            </p>

            <nav class="logout-actions" aria-label="Nächster Schritt">
                <a class="logout-button" href="/login">
                    <span class="logout-button__stamp" aria-hidden="true">
                        <img src="/arcanum-stamp.png" alt="">
                    </span>
                    <span>Zurück zur Loginseite</span>
                </a>

                <a
                    class="logout-button"
                    href="https://lms2.schulcampus-rlp.de/SN-70305/course/view.php?id=1963"
                >
                    <span class="logout-button__stamp" aria-hidden="true">
                        <img src="/arcanum-stamp.png" alt="">
                    </span>
                    <span>Zur Lernplattform SOL</span>
                </a>
            </nav>
        </section>
    </main>

    <script src="/arcanum-logout.js"></script>
</body>
</html>
