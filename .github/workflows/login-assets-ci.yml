name: Login image assets CI

on:
  push:
    branches:
      - "perf/login-assets-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v7

      - name: Check out canonical Core API dependency
        uses: actions/checkout@v7
        with:
          repository: Learn-Monitor/student-database
          ref: arcanum-2026
          path: .ci/student-database

      - name: Set up project JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS test dependencies
        run: npm ci

      - name: Build Core API JAR with the Core Gradle wrapper
        working-directory: .ci/student-database
        run: ./gradlew --no-daemon --no-parallel --max-workers=1 --console=plain jar

      - name: Locate Core API JAR
        id: core-api
        run: |
          set -euo pipefail
          mapfile -t jars < <(find .ci/student-database/build/libs -maxdepth 1 -type f -name 'student-database-*.jar' ! -name '*-fat.jar' -print)
          test "${#jars[@]}" -eq 1
          echo "jar=${GITHUB_WORKSPACE}/${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C .ci/student-database rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run repository checks, full tests, and plugin build
        env:
          STUDENT_DATABASE_JAR: ${{ steps.core-api.outputs.jar }}
        run: scripts/check

      - name: Verify exactly one plugin JAR and write provenance
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          CORE_API_COMMIT: ${{ steps.core-api.outputs.commit }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' -print)
          test "${#jars[@]}" -eq 1
          mkdir -p dist
          cp "${jars[0]}" dist/
          artifact=$(basename "${jars[0]}")
          sha256sum "dist/$artifact" | tee dist/SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          artifact = next(p for p in pathlib.Path("dist").glob("*.jar"))
          data = {
              "repository": os.environ["SOURCE_REPOSITORY"],
              "ref": os.environ["SOURCE_REF"],
              "commit": os.environ["SOURCE_SHA"],
              "artifact": artifact.name,
              "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "core_api_dependency_commit": os.environ["CORE_API_COMMIT"],
              "tests": {"overlay_node_suite": "passed", "gradle_build": "passed"},
              "status": "passed"
          }
          pathlib.Path("dist/provenance.json").write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data, indent=2))
          PY

      - name: Upload tested Overlay JAR and provenance
        uses: actions/upload-artifact@v7
        with:
          name: arcanum-overlay-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
