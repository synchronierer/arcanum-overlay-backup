name: Login image assets CI

on:
  push:
    branches:
      - "perf/login-assets-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v7

      - name: Set up project JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS test dependencies
        run: npm ci

      - name: Check out canonical Core API dependency outside the Overlay workspace
        run: git clone --depth=1 --branch arcanum-2026 https://github.com/Learn-Monitor/student-database.git "$RUNNER_TEMP/student-database"

      - name: Build Core API JAR with the Core Gradle wrapper
        run: cd "$RUNNER_TEMP/student-database" && ./gradlew --no-daemon --no-parallel --max-workers=1 --console=plain shadowJar

      - name: Locate Core API JAR
        id: core-api
        run: |
          set -euo pipefail
          mapfile -t jars < <(find "$RUNNER_TEMP/student-database/build/libs" -maxdepth 1 -type f -name 'student-database-*-fat.jar' -print)
          test "${#jars[@]}" -eq 1
          echo "jar=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C "$RUNNER_TEMP/student-database" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          sha256sum "${jars[0]}" | awk '{print "sha256="$1}' >> "$GITHUB_OUTPUT"

      - name: Run repository checks, full tests, and plugin build
        env:
          STUDENT_DATABASE_JAR: ${{ steps.core-api.outputs.jar }}
        run: set -o pipefail; scripts/check 2>&1 | tee "$RUNNER_TEMP/overlay-check.log"

      - name: Count Gradle and JavaScript tests
        id: test-counts
        run: |
          python3 - <<'PY'
          import glob, os, pathlib, re, xml.etree.ElementTree as ET
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in glob.glob("build/test-results/**/*.xml", recursive=True):
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          log = pathlib.Path(os.environ["RUNNER_TEMP"], "overlay-check.log").read_text()
          matches = re.findall(r"^# tests (\d+)\s*$", log, re.MULTILINE)
          if not matches:
              raise SystemExit("Node test summary not found in scripts/check output")
          print(f"Gradle test totals: {totals}")
          print(f"Node test count: {matches[-1]}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"gradle-tests={totals['tests']}\n")
              output.write(f"node-tests={matches[-1]}\n")

      - name: Verify exactly one plugin JAR and write provenance
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          CORE_API_COMMIT: ${{ steps.core-api.outputs.commit }}
          CORE_API_SHA256: ${{ steps.core-api.outputs.sha256 }}
          GRADLE_TEST_COUNT: ${{ steps.test-counts.outputs.gradle-tests }}
          NODE_TEST_COUNT: ${{ steps.test-counts.outputs.node-tests }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' -print)
          test "${#jars[@]}" -eq 1
          mkdir -p dist
          cp "${jars[0]}" dist/
          artifact=$(basename "${jars[0]}")
          sha256sum "dist/$artifact" | tee dist/SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          artifact = next(p for p in pathlib.Path("dist").glob("*.jar"))
          data = {
              "repository": os.environ["SOURCE_REPOSITORY"],
              "ref": os.environ["SOURCE_REF"],
              "commit": os.environ["SOURCE_SHA"],
              "artifact": artifact.name,
              "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "core_api_dependency_commit": os.environ["CORE_API_COMMIT"],
              "core_api_dependency_sha256": os.environ["CORE_API_SHA256"],
              "tests": {
                  "overlay_node_suite": {"count": int(os.environ["NODE_TEST_COUNT"]), "status": "passed"},
                  "gradle_suite": {"count": int(os.environ["GRADLE_TEST_COUNT"]), "status": "passed"},
                  "gradle_build": "passed"
              },
              "status": "passed"
          }
          pathlib.Path("dist/provenance.json").write_text(json.dumps(data, indent=2) + "\n")
          print(json.dumps(data, indent=2))
          PY

      - name: Upload tested Overlay JAR and provenance
        uses: actions/upload-artifact@v7
        with:
          name: arcanum-overlay-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
